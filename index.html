<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2336">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>أذكاري</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e2336;--card:#232940;--ink:#f1f1f1;--mut:#9aa3b5;--acc:#d25252;--acc2:#2d344a;--line:#3a4259;--red:#e0816f;--grn:#58b27a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f7f3ec;--card:#fffdf8;--ink:#1f2a24;--mut:#6b736d;--acc:#c0453f;--acc2:#f1e3df;--line:#e5dccb;--red:#b4432f;--grn:#2f8a57}
:root[data-theme="dark"]{--bg:#1e2336}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Arabic','Amiri','Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 48px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 14px;font:inherit;font-size:17px;cursor:pointer}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.d{color:var(--red)}.btn:disabled{opacity:.4}
.hero{text-align:center;margin:8px 0 18px}.hero h1{font-size:32px;margin:6px 0 0}.hero p{color:var(--mut);margin:2px 0 0;font-size:18px}
.top{display:flex}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center;cursor:pointer}
.cat:active{transform:scale(.98)}.cat .ico{font-size:44px}.cat b{display:block;font-size:21px;margin-top:4px}.cat small{color:var(--mut);font-size:16px}
.wide{grid-column:1/-1}
.mini{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.mini i{display:block;height:100%;background:var(--acc)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bar h2{flex:1;margin:0;font-size:23px;text-align:center}.bar span{color:var(--mut);font-size:16px;min-width:60px;text-align:left}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ci{width:46px;height:46px;border-radius:50%;background:var(--acc2);display:grid;place-items:center;font-size:24px;flex:none}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx span{color:var(--mut);font-size:15px}
.badge{background:var(--acc);color:#fff;border-radius:16px;padding:2px 10px;font-size:16px;flex:none}.row.done{opacity:.55}.row.done .badge{background:var(--mut)}
.dt{text-align:center}.big-i{font-size:58px;line-height:1.3}.ttl{color:var(--acc);font-weight:700;font-size:20px;margin-bottom:6px}
.txt{font-size:24px;line-height:2.05;white-space:pre-line;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.ring{width:150px;height:150px;border-radius:50%;border:0;background:var(--acc);color:#fff;font:inherit;font-size:46px;font-weight:700;margin:18px auto 6px;display:block;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.ring:active{transform:scale(.95)}.ring.done{background:var(--mut)}
.hint{color:var(--mut);font-size:16px;margin-bottom:14px}.nav{display:flex;gap:8px}.nav .btn{flex:1}
.empty{text-align:center;color:var(--mut);font-size:19px;margin:30px 0}
.pn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.pn h3{font-size:20px;margin:0 0 10px;color:var(--acc)}
.pn input,.pn textarea,.pn select{width:100%;font:inherit;font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.pn textarea{min-height:90px}.fr{display:flex;gap:8px}.fr>*{flex:1}.pn p{color:var(--mut);font-size:14px;margin:0 0 8px}
.acts{display:flex;gap:6px;flex:none}.acts .btn{padding:4px 10px;font-size:15px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd h2{flex:1;margin:0;font-size:30px;font-weight:400}.hd span{color:var(--mut);font-size:17px}
.bk{width:48px;height:44px;font-size:28px;padding:0;background:var(--acc2);border:0;border-radius:12px;line-height:1}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 6px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 88%;scroll-snap-align:center}
.sc{border:1px solid var(--line);border-radius:18px;padding:18px 16px;min-height:70vh;min-height:calc(100dvh - 150px);display:flex;flex-direction:column}
.sx{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}.sx .ttl{font-size:19px;margin-bottom:8px}
.at{color:var(--ink);font-size:24px;line-height:2.1;font-weight:400;white-space:pre-line}
.sc hr{border:0;border-top:2px solid var(--line);width:100%;margin:12px 0}.nt{font-size:18px;line-height:1.9;margin-bottom:6px}
.ct{display:flex;justify-content:space-around;align-items:center;margin:14px 0}
.sp{width:64px;height:64px;border-radius:50%;border:2px solid var(--grn);background:none;font-size:26px;cursor:pointer;color:var(--ink)}
.rg{position:relative;width:84px;height:84px;border:0;background:none;color:var(--ink);font:inherit;padding:0;cursor:pointer}.rg svg{position:absolute;inset:0}.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:400}
.sh{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-size:34px;padding:12px;margin-top:14px;cursor:pointer}.sh:active{opacity:.85}.sh.dn{background:var(--mut)}
.sc.fl{animation:fl .8s}@keyframes fl{0%{box-shadow:0 0 0 0 rgba(88,178,122,.8);border-color:var(--grn)}100%{box-shadow:0 0 0 16px rgba(88,178,122,0)}}
html{touch-action:manipulation}.sc,.car{-webkit-user-select:none;user-select:none}.ts{pointer-events:none}
.fs{position:fixed;inset:0;z-index:50;pointer-events:none;background:#58b27a;opacity:0;animation:fs .9s ease-out}@keyframes fs{0%{opacity:0}15%{opacity:.5}38%{opacity:.08}58%{opacity:.45}100%{opacity:0}}
.at.qr{font-family:'Amiri Quran','Amiri',serif;font-size:27px;line-height:2.4}
.pre{color:#e0b45a}:root[data-theme="light"] .pre{color:#9a6b12}
.am{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:2.2em;height:2.2em;padding:0 .4em;border:1.5px solid #c9a24a;border-radius:999px;font-size:.55em;line-height:1;vertical-align:middle;margin:0 .25em;font-family:'Noto Sans Arabic','Segoe UI',sans-serif;white-space:nowrap}:root[data-theme="light"] .am{border-color:#9a6b12}
.ts{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:17px}
</style>
</head>

<div class="wrap"><div id="app"></div></div>
<script>
var SEED=[
{x:"أَسْتَغْفِرُ اللَّهَ",n:3,p:"s"},
{x:"اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ",n:1,p:"s"},
{x:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:10,p:"s"},
{x:"اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ\nلَا إِلَهَ إِلَّا اللَّهُ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ، وَلَهُ الْفَضْلُ، وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ، وَلَوْ كَرِهَ الْكَافِرُونَ.",n:1,p:"s"},
{x:"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَاللَّهُ أَكْبَرُ",n:33,p:"s"},
{x:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:1,p:"s"},
{t:"آيَةُ الْكُرْسِيِّ",q:1,x:"أَعُوذُ بِٱللَّهِ مِنَ ٱلشَّيْطَٰنِ ٱلرَّجِيمِ\n﴿ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ ۝٢٥٥",n:1,p:"mes"},
{t:"آخِرُ آيَتَيْنِ مِنْ سُورَةِ الْبَقَرَةِ",q:1,x:"أَعُوذُ بِٱللَّهِ مِنَ ٱلشَّيْطَٰنِ ٱلرَّجِيمِ\n﴿ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ ۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِۦ ۚ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ ۝٢٨٥ لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ ۝٢٨٦",n:1,p:"b"},
{t:"سُورَةُ الْإِخْلَاصِ",q:1,x:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\n﴿قُلْ هُوَ ٱللَّهُ أَحَدٌ ۝١ ٱللَّهُ ٱلصَّمَدُ ۝٢ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝٣ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌ ۝٤",n:3,p:"mes"},
{t:"سُورَةُ الْفَلَقِ",q:1,x:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\n﴿قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ ۝١ مِن شَرِّ مَا خَلَقَ ۝٢ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝٣ وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ ۝٤ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝٥",n:3,p:"mes"},
{t:"سُورَةُ النَّاسِ",q:1,x:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\n﴿قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ ۝١ مَلِكِ ٱلنَّاسِ ۝٢ إِلَٰهِ ٱلنَّاسِ ۝٣ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ۝٤ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ ۝٥ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ ۝٦",n:3,p:"mes"},
{x:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",n:3,p:"b"},
{x:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",n:3,p:"b"},
{x:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ، وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",n:1,p:"m"},
